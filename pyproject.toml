[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archive-org-mcp"
version = "0.1.0"
description = "MCP server for archive.org — Wayback Machine, Internet Archive catalog, and saved-page retrieval"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Les Leslie", email = "les@wedgwoodwebworks.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=2.12.0",
    "httpx2>=0.28.1",
    "mcp-common>=0.18.0",
    "oneiric>=0.16.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.8",
    "mypy>=1.9.0",
    "bandit>=1.7.9",
]

[project.scripts]
archive-org-mcp = "archive_org_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/lesleslie/archive-org-mcp"
Repository = "https://github.com/lesleslie/archive-org-mcp"

[tool.hatch.build.targets.wheel]
packages = ["archive_org_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/dist",
    "/tests",
    "/.cache",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast hermetic tests",
    "integration: exercises a tool end-to-end",
    "slow: takes more than 10 seconds",
    "requires_network: makes a real outbound call",
]
addopts = "--cov=archive_org_mcp --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["archive_org_mcp"]
omit = ["archive_org_mcp/__main__.py"]

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
]